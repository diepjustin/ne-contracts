name: NE Contracts seed cache

# Seeds the `ne-contracts-data-` cache on whatever ref this runs from.
#
# Run this from main. A cache is only visible to the ref that saved it or to
# the default branch, so a seed cache is useful exactly when it was saved by a
# run on main -- seeding from a short-lived branch produces a cache the nightly
# scrape can never restore, which is how the Aug 2026 outage happened.
#
# Point it at a run that uploaded an `ne-contracts-data-rescue` artifact (see
# `rescue-cache.yml`); or tick from_release to seed from the newest hub-data
# release, which is the way back once every cache entry has gone (GitHub evicts
# one unused for 7 days); or leave both blank to seed from CSVs committed to the
# ref being run from.

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Run ID of a rescue-cache.yml run whose ne-contracts-data-rescue artifact holds data/. Blank = see from_release.'
        type: string
        required: false
      from_release:
        description: 'Seed from the newest ne-contracts-hub-data- release instead (its CSVs, stamps, document log and --daily state).'
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    # Declared, not left implicit: an explicit `shell: bash` runs each step as
    # `bash --noprofile --norc -eo pipefail {0}`, while the implicit default is `bash -e {0}`,
    # under which a failing `gh ... | jq | xargs` prune exits 0 and is never noticed.
    shell: bash

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # checkout
      actions: read     # gh run download from another run, and gh cache list
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; gh gets its token from env

      - name: Take one source at a time
        if: inputs.artifact_run_id != '' && inputs.from_release
        run: |
          echo "::error::give artifact_run_id or from_release, not both"
          exit 1

      # Only an artifact rescue-cache.yml made in this repository. Any run here can
      # upload an artifact by that name, a pull request from a fork included (its run
      # uses the fork's workflow files), and this one becomes the baseline the nightly
      # diffs against.
      - name: Check the run is a rescue-cache.yml run of this repository
        if: inputs.artifact_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          case "$ARTIFACT_RUN_ID" in
            ''|*[!0-9]*) echo "::error::artifact_run_id must be a run's numeric id"; exit 1 ;;
          esac
          got=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" \
                  --jq '[.path, .event, .head_repository.full_name, .conclusion] | join(" ")')
          want=".github/workflows/rescue-cache.yml workflow_dispatch $GITHUB_REPOSITORY success"
          if [ "$got" != "$want" ]; then
            echo "::error::run $ARTIFACT_RUN_ID is [$got], not a successful dispatched rescue-cache.yml run of this repository -- refusing to seed from its artifact"
            exit 1
          fi
          echo "run $ARTIFACT_RUN_ID: $got"

      - name: Download data/ from the rescue run
        if: inputs.artifact_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          rm -rf data
          mkdir -p data
          gh run download "$ARTIFACT_RUN_ID" \
            --name ne-contracts-data-rescue \
            --dir data

      # The nightly publishes this every night it scrapes, so it is at most a day or two
      # behind. Its daily_state.tar.gz carries the amendment log, flip ledgers and leak
      # streaks; a release from before Oct 2026 has none, which costs the amendment
      # history and makes the next nights read owed flip-backs as strays (see README.md,
      # "Strays that never go away").
      - name: Download data/ from the newest hub-data release
        if: inputs.from_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
                  --jq '[.[].tagName | select(startswith("ne-contracts-hub-data-"))] | sort | last // empty')
          if [ -z "$tag" ]; then
            echo "::error::no ne-contracts-hub-data- release to seed from"
            exit 1
          fi
          echo "seeding from $tag"
          dl="$RUNNER_TEMP/release"
          rm -rf "$dl"
          mkdir -p "$dl" data
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dl"
          for f in "$dl"/*.csv.gz "$dl"/scrape_meta.json.gz "$dl"/documents.jsonl.gz; do
            if [ -f "$f" ]; then
              gunzip -c "$f" > "data/$(basename "$f" .gz)"
            fi
          done
          if [ -f "$dl/daily_state.tar.gz" ]; then
            tar -xzf "$dl/daily_state.tar.gz" -C data
            echo "--daily state: $(tar -tzf "$dl/daily_state.tar.gz" | paste -sd' ' -)"
          else
            echo "::warning::$tag has no daily_state.tar.gz: no amendment log, flip ledgers or leak streaks to restore"
          fi

      - name: Verify data/ carries the CSVs before seeding
        run: |
          ls -la data/
          # Seeding an empty data/ is worse than not seeding: prefix-restore
          # takes the newest match, so it would shadow a good cache rather than
          # simply be absent.
          if ! ls data/*.csv >/dev/null 2>&1; then
            echo "::error::no CSVs in data -- refusing to seed an empty cache"
            exit 1
          fi
          du -sh data

      - name: Save the cache under this ref
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: ne-contracts-data-seed-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report where the cache landed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache list --key ne-contracts-data- --json key,ref,sizeInBytes,createdAt
