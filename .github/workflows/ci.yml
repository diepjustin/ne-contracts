name: CI

# Why this exists: branch protection on main requires a status check named "build", and the
# only job with that name is pages.yml's, which runs on a push to main -- after a change has
# landed -- so no pull request could ever satisfy it, and nothing tested a change before it
# merged. This runs the same tests and page lint as pages.yml's build job on every pull
# request to main, and nothing else: no cache, no release, no deploy, no secrets.
#
# Deliberately not `pull_request_target` (it runs with the base repo's token and secrets, and
# this repo is public), and deliberately not also `push`, which would report the same check
# twice on a PR's head commit. pages.yml is left alone: its `build` job feeds its `deploy` job,
# and giving it a pull_request trigger would run the deploy and the cache prune on PR refs.
# The job id must stay `build` with no `name:`, or the required context stops being produced;
# tests/test_ci_workflow.py fails if it does.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # Declared, not left implicit: an explicit `shell: bash` runs each step as
    # `bash --noprofile --norc -eo pipefail {0}`, while the implicit default is `bash -e {0}`,
    # under which a failing `gh ... | jq | xargs` prune exits 0 and is never noticed.
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python3 -m pytest tests/ -q

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Lint the page
        run: python3 scripts/lint_page.py
