name: NE Contracts daily scrape

on:
  schedule:
    # Both fire every night. The first to get through scrapes; the gate step
    # below makes the second a backup that skips once tonight's data is
    # complete, and retries the night if it is not. Off the hour on purpose:
    # the top of the hour is when GitHub's scheduler is most loaded, and runs
    # here already start 4-5 hours late.
    - cron: '17 3 * * *'   # 10:17pm CDT / 9:17pm CST
    - cron: '47 4 * * *'   # backup: 11:47pm CDT / 10:47pm CST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape and run the publish checks, but do not deploy.'
        type: boolean
        default: false

# Nothing at workflow level: each job asks for exactly what it uses.
permissions: {}

defaults:
  run:
    # Declared, not left implicit: an explicit `shell: bash` runs each step as
    # `bash --noprofile --norc -eo pipefail {0}`, while the implicit default is `bash -e {0}`,
    # under which a failing `gh ... | jq | xargs` prune exits 0 and is never noticed.
    shell: bash

concurrency:
  group: ne-contracts-daily
  cancel-in-progress: false   # never cancel a run that might be mid-write to data/

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create/upload/delete, and deleting orphaned hub-data tags;
                        # this job no longer commits to the tree
      actions: write    # gh cache delete, and gh workflow run pages.yml
    timeout-minutes: 180
    env:
      # Line-by-line logs: without this, every progress line of a scrape step
      # reached the log in its last few milliseconds (scraper-09).
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # nothing here pushes; gh gets its token from env

      - name: Decide whether tonight still needs a scrape
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # Idempotent, and never on the wall clock or on which cron entry
          # fired. A scheduled run proceeds unless every dataset already
          # finished tonight -- tonight being noon-to-noon Central -- according
          # to the scrape_meta.json in the newest hub-data release, which every
          # run with a usable data/ publishes. So the second entry is a backup:
          # it skips a finished night and retries an unfinished one. Every
          # doubt (no release, a download error, an unreadable file) means run:
          # running twice is harmless, a skipped night is not. See
          # scripts/nightly_gate.py for why the night starts at noon.
          #
          # What this replaced gated on *which* entry fired, by the current UTC
          # offset. With runs starting 4-5 hours late, both entries would have
          # skipped the 14 Mar 2027 spring-forward night (sc-03, ci-07). An
          # hour-equals-22 check before that silently no-oped whole nights.
          started=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          proceed=true
          if [ "$EVENT" = 'schedule' ]; then
            gate="$RUNNER_TEMP/gate"
            mkdir -p "$gate"
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
                    --jq '[.[].tagName | select(startswith("ne-contracts-hub-data-"))] | sort | last // empty') \
              || { echo "::warning::could not list releases -- scraping to be safe"; tag=''; }
            if [ -n "$tag" ] && gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                 --pattern 'scrape_meta.json.gz' --dir "$gate" --clobber \
               && gunzip -f "$gate/scrape_meta.json.gz"; then
              echo "newest hub-data release: $tag"
              if python3 scripts/nightly_gate.py --meta "$gate/scrape_meta.json"; then
                proceed=false
                echo "Tonight is already complete; this entry is the backup. Skipping."
              fi
            else
              echo "no usable scrape_meta.json from ${tag:-any hub-data release} -- scraping"
            fi
          fi

          # Every night that scrapes also publishes. This used to be Sunday
          # only, which left the site up to six days behind a source the state
          # updates daily, and left the guard rail below unrun on the other six
          # nights. There is no weekday arithmetic left here on purpose: the
          # rolled-back weekday existed only so a scrape that slipped past
          # midnight still counted as Sunday, and nothing now cares what day
          # it is.
          publish=$proceed

          # dry_run exercises the publish leg without publishing: the checks
          # run, the deploy is not dispatched.
          deploy=$publish
          if [ "$DRY_RUN" = 'true' ]; then
            deploy=false
            echo "dry_run: running the checks, but not dispatching a deploy."
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          # When this run began, for the last step: a dataset's scrape stamp earlier
          # than this means tonight's scrape did not finish it.
          echo "started=$started" >> "$GITHUB_OUTPUT"
          echo "$EVENT -> proceed=$proceed publish=$publish deploy=$deploy"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      # Before the scrape, not beside the build: these are pure-function tests
      # over the format and the parsers, they need no network and no data/, and
      # a broken parser should stop the run before it spends an hour fetching.
      - name: Tests
        if: steps.gate.outputs.proceed == 'true'
        run: python3 -m pytest tests/ -q

      - name: Restore data/ cache
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: ne-contracts-data-${{ github.run_id }}     # never pre-exists -- forces the restore-keys fallback below
          restore-keys: |
            ne-contracts-data-
          # Fail here, loudly, rather than three steps later inside scrape.py.
          # A miss means the baseline is gone, which is a 20+ hour re-scrape to
          # recover from -- it should never be mistaken for a scraper bug.
          fail-on-cache-miss: true

      - name: Log restored data/ sizes
        if: steps.gate.outputs.proceed == 'true'
        run: ls -la data/*.csv 2>&1 || echo "no CSVs restored -- scrape.py --daily will refuse to run and fail this job"

      # --hours: each dataset stops cleanly, checkpointed, after 45 minutes,
      # so three of them can never reach the job's 180-minute hard kill. A
      # normal night is about 16 minutes for all three. A dataset cut short
      # keeps its old stamp, so the last step turns the run red, and the
      # backup entry (or tomorrow) resumes where it stopped.
      - name: Daily scrape -- contract
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/scrape.py contract --daily --hours 0.75

      - name: Daily scrape -- purchase-order
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/scrape.py purchase-order --daily --hours 0.75

      - name: Daily scrape -- state
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/scrape.py state --daily --hours 0.75

      # --- Publish leg: every night the scrape ran ---
      #
      # This runs *before* the cache save on purpose. check_daily_diff.py clears
      # data/daily_diff_report.json on both its exit paths, and that clear only
      # survives if the save happens afterwards. With the save first, the report
      # accumulated forever and one bad day would have blocked every future
      # publish permanently.

      - name: Check entity list drift
        if: steps.gate.outputs.publish == 'true'
        run: python3 scripts/check_entity_drift.py

      # No build here any more. pages.yml rebuilds the payload and deploys it
      # as a Pages artifact, so nothing this job produces needs committing --
      # which is the whole point: every published build used to add ~50 MB to
      # git history permanently.
      #
      # This step still gates publishing, though: it fails the job, and the
      # dispatch below sits after it. A scrape this rejects therefore never
      # reaches the site.
      - name: Guard rail on tonight's diff
        if: steps.gate.outputs.publish == 'true'
        run: python3 scripts/check_daily_diff.py

      # Publishing is a separate workflow now, and this is the only thing that
      # asks it to run on a data change -- once a night now, at the end of the
      # scrape that produced it. It sits after the guard rail on
      # purpose: check_daily_diff.py fails the job, so a scrape it rejects
      # never reaches this step and never reaches the site. dry_run stops here
      # too, since it sets deploy=false.
      - name: Deploy the rebuilt site
        if: steps.gate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          echo "dispatched pages.yml — it rebuilds the payload and deploys it"

      # Saving still runs on failure -- a scrape that died halfway has real
      # progress worth keeping, and --daily resumes from it. But it must never
      # save a data/ with no CSVs in it: restore takes the *newest* prefix
      # match, so one empty cache shadows the good one on every run afterwards
      # and the failure becomes self-perpetuating. That is exactly what took
      # the nightly job down in Aug 2026.
      - name: Check data/ is worth caching
        id: cachecheck
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          if ls data/*.csv >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            du -sh data
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::data holds no CSVs -- skipping the cache save so the existing good cache stays the newest match."
          fi

      - name: Save data/ cache
        if: always() && steps.cachecheck.outputs.ok == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: ne-contracts-data-${{ github.run_id }}-${{ github.run_attempt }}

      # Only prune once this run has banked a good cache of its own, so a run
      # that saved nothing can never age out the baseline it failed to replace.
      - name: Delete old data/ cache entries (keep newest 3)
        if: always() && steps.cachecheck.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key ne-contracts-data- --json id,createdAt --limit 100 \
            | jq -r 'sort_by(.createdAt) | reverse | .[3:] | .[].id' \
            | xargs -r -n1 gh cache delete

      # ne-connect (the hub) has no way to read this repo's gitignored data/
      # directly -- GitHub Actions caches are strictly repo-scoped, so a cache
      # saved here can never be restored by a workflow running in ne-connect.
      # A release is the one thing that crosses that boundary (ne-lobbying's
      # own monthly backup already does this, PLAN.md 0.5) -- ne-connect-
      # nightly.yml downloads the latest ne-contracts-hub-data-* release.
      # Warn rather than fail: a missed release here should never take down a
      # scrape that already succeeded at its real job. Gated on cachecheck
      # (runs after it, not before) since that's the same "data/ actually has
      # something in it" signal the cache save already uses.
      - name: Publish a data release for ne-connect
        if: always() && steps.cachecheck.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          for f in data/nu_contracts.csv data/nu_purchase_orders.csv data/state_agencies.csv data/scrape_meta.json; do
            if [ -f "$f" ]; then
              gzip -c "$f" > "release/$(basename "$f").gz"
            else
              echo "::warning::$f missing -- skipping it in tonight's hub-data release"
            fi
          done
          if ls release/*.gz >/dev/null 2>&1; then
            tag="ne-contracts-hub-data-$(TZ=America/Chicago date +%Y-%m-%d)"
            # Same-day re-run would otherwise hit "a release with the same
            # tag name already exists" and silently keep serving the first
            # run's stale data -- confirmed happening for real in ne-fec's
            # identical pattern on 2026-09-19 -- delete any existing
            # same-day release first so a re-run actually replaces it.
            gh release delete "$tag" --repo diepjustin/ne-contracts --yes 2>/dev/null || true
            gh release create "$tag" release/*.gz \
              --repo diepjustin/ne-contracts \
              --title "Contracts hub data — $(TZ=America/Chicago date +%Y-%m-%d)" \
              --notes "Automated data export for ne-connect-nightly.yml. See ne-connect's PLAN.md." \
              || echo "::warning::gh release create failed -- ne-connect will build from its previous release tonight"
          else
            echo "::warning::nothing to release -- skipping"
          fi

      # Sorted by tag name, never createdAt. A release's createdAt is the date
      # of the commit its tag points at, not when it was published, so every
      # release cut from an unchanged main ties -- and the list returns ties
      # newest-first, which `reverse` turned into newest-last, so `.[3:]`
      # deleted the release this run had just made. 09-25, 09-26 and 09-27
      # 2026 were all published and deleted within the same run, and
      # ne-connect built from the 09-24 release for three nights. The tag
      # carries its own Central date (YYYY-MM-DD), so it sorts correctly as
      # text -- the same key ne-connect already uses to pick the newest.
      - name: Delete old hub-data releases (keep newest 3)
        if: always() && steps.cachecheck.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo diepjustin/ne-contracts --json tagName --limit 100 \
            | jq -r '[.[] | select(.tagName | startswith("ne-contracts-hub-data-"))] | sort_by(.tagName) | reverse | .[3:] | .[].tagName' \
            | xargs -r -n1 -I{} gh release delete {} --repo diepjustin/ne-contracts --yes

      # Last, after the deploy dispatch, the cache save, the release and its prune, so it
      # can colour the run red without blocking any of them. scrape.py stamps a dataset
      # only when every entity in it was read, so a night that does not finish leaves the
      # stamp where it was, exits 0, and ends green; the 24 Sep 2026 freeze went 19 nights
      # that way. This compares each stamp with the moment the run began and fails, with
      # an ::error line per dataset, if any is older. The start time goes through env, never
      # into the command line. See scripts/check_scrape_stamps.py.
      - name: Check that every dataset finished tonight
        if: always() && steps.gate.outputs.proceed == 'true'
        env:
          RUN_STARTED: ${{ steps.gate.outputs.started }}
        run: python3 scripts/check_scrape_stamps.py --since "$RUN_STARTED"
