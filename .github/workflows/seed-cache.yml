name: NE Contracts seed cache

# Seeds the `ne-contracts-data-` cache on whatever ref this runs from.
#
# Run this from main. A cache is only visible to the ref that saved it or to
# the default branch, so a seed cache is useful exactly when it was saved by a
# run on main -- seeding from a short-lived branch produces a cache the nightly
# scrape can never restore, which is how the Aug 2026 outage happened.
#
# Point it at a run that uploaded an `ne-contracts-data-rescue` artifact (see
# `rescue-cache.yml`), or leave the input blank to seed from CSVs committed to
# the ref being run from.

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Run ID whose ne-contracts-data-rescue artifact holds data/. Blank = use data/ as checked out.'
        type: string
        required: false

permissions: {}

defaults:
  run:
    # Declared, not left implicit: an explicit `shell: bash` runs each step as
    # `bash --noprofile --norc -eo pipefail {0}`, while the implicit default is `bash -e {0}`,
    # under which a failing `gh ... | jq | xargs` prune exits 0 and is never noticed.
    shell: bash

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # checkout
      actions: read     # gh run download from another run, and gh cache list
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # nothing here pushes; gh gets its token from env

      - name: Download data/ from the rescue run
        if: inputs.artifact_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          rm -rf data
          mkdir -p data
          gh run download "$ARTIFACT_RUN_ID" \
            --name ne-contracts-data-rescue \
            --dir data

      - name: Verify data/ carries the CSVs before seeding
        run: |
          ls -la data/
          # Seeding an empty data/ is worse than not seeding: prefix-restore
          # takes the newest match, so it would shadow a good cache rather than
          # simply be absent.
          if ! ls data/*.csv >/dev/null 2>&1; then
            echo "::error::no CSVs in data -- refusing to seed an empty cache"
            exit 1
          fi
          du -sh data

      - name: Save the cache under this ref
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: ne-contracts-data-seed-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report where the cache landed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache list --key ne-contracts-data- --json key,ref,sizeInBytes,createdAt
